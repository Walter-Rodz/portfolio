<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-image: url('Assets/ContactBack.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Persona 5 Styled Angled Container */
        .contact-box {
            position: relative;
            width: 650px;
            background: #000;
            border: 5px solid #fff;
            padding: 40px 45px;
            transform: skewX(-6deg) rotate(1deg);
            box-shadow: -12px 14px 0px #d80000;
            z-index: 2;
            box-sizing: border-box;
        }

        /* Counter-skew content to maintain sharp readability */
        .box-inner {
            transform: skewX(6deg);
        }

        .contact-title {
            font-size: 2.8rem;
            text-transform: uppercase;
            font-style: italic;
            margin: 0 0 8px 0;
            color: #fff;
            background: #d80000;
            display: inline-block;
            padding: 6px 18px;
            transform: rotate(-2deg);
        }

        .contact-subtitle {
            font-size: 1.1rem;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* Contact Items Wrapper */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Menu Rows Styled Like the P5 Party List */
        .contact-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-left: 5px solid #d80000;
            padding: 12px 20px;
            transform: skewX(-4deg);
            text-decoration: none;
            color: #fff;
            transition: all 0.15s ease-in-out;
        }

        /* Hover Effect: Background turns white, all inner text turns black */
        .contact-row:hover {
            background: #fff;
            color: #000;
            border-left-color: #000;
            transform: skewX(-4deg) scale(1.02) translateX(6px);
        }

        .label {
            font-size: 1.3rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
        }

        /* Icon spacing inside button label */
        .label i {
            margin-right: 12px;
        }

        .value {
            font-size: 1.1rem;
            font-style: italic;
            color: #fff;
            font-weight: bold;
        }

        /* Ensure right-side text also turns black on row hover */
        .contact-row:hover .value {
            color: #000;
        }

        /* Navigation Footer Link */
        .nav-footer {
            margin-top: 45px;
            z-index: 3;
        }

        .back-link {
            color: #000;
            background: #fff;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            padding: 12px 24px;
            font-size: 1.1rem;
            border: 3px solid #000;
            text-transform: uppercase;
            font-style: italic;
            box-shadow: 4px 4px 0px #d80000;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background: #d80000;
            color: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="contact-box">
        <div class="box-inner">
            <h1 class="contact-title">CONTACT ME</h1>
            <div class="contact-subtitle">// Let's Connect & Work Together</div>

            <div class="contact-list">
                <a href="mailto:Jimmycarol331@gmail.com" class="contact-row">
                    <span class="label"><i class="fa-solid fa-envelope"></i>Jimmycarol331@gmail.com</span>
                </a>

                <a href="https://github.com/Walter-Rodz" target="_blank" rel="noopener noreferrer" class="contact-row">
                    <span class="label"><i class="fa-brands fa-github"></i>GitHub</span>
                </a>

                <a href="https://www.linkedin.com/in/walter-rodriguez-aa8421246/" target="_blank" rel="noopener noreferrer" class="contact-row">
                    <span class="label"><i class="fa-brands fa-linkedin"></i>LinkedIn</span>
                </a>

                <a href="Assets/Resume.pdf" target="_blank" rel="noopener noreferrer" class="contact-row">
                    <span class="label"><i class="fa-solid fa-file-pdf"></i>Resume</span>
                </a>
            </div>
        </div>
    </div>

    <div class="nav-footer">
        <a href="index (1).html" class="back-link">← Back to Main Menu</a>
    </div>

</body>
</html>
