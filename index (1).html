<!DOCTYPE html>
<html lang="en">
<head>

    <title>My Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">

    
    
    <style>
        body {
            background-image: url('StartBackground.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-right: 25vw; /* Offsets whole menu slightly to the left of true center */
            font-family: 'Montserrat', 'Impact', sans-serif;
            overflow: hidden;
        }

        .p5-menu {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
        }

        .p5-text-group {
            display: flex;
            flex-wrap: wrap;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s ease-in-out;
        }

        .p5-text-group:hover {
            transform: scale(1.08) rotate(-2deg);
        }

        /* Styling individual letters */
        .p5-letter {
            display: inline-block;
            font-size: 2.6rem;    /* Increased size slightly (up from 2rem) i am also awesome!*/
            font-weight: 900;
            font-style: italic;
            color: #111;
            background-color: #fff;
            padding: 3px 10px;    /* Scaled padding to match larger font */
            margin: -2px;
            border: 2.5px solid #000;
            text-transform: uppercase;
            box-shadow: 3.5px 3.5px 0px #000;
            user-select: none;
        }

        /* Alternating black & white Persona 5 tag effects */
        .p5-letter:nth-child(odd) {
            background-color: #ffffff;
            color: #000000;
            transform: skewX(-12deg) rotate(-3deg);
        }

        .p5-letter:nth-child(even) {
            background-color: #000000;
            color: #ffffff;
            transform: skewX(-8deg) rotate(4deg) translateY(-4px);
        }

        /* Specific rotation tweaks to mimic chaotic hand-drawn layout */
        .p5-letter:nth-child(3n) {
            transform: skewX(-15deg) rotate(-6deg) scale(1.05);
        }

        .p5-letter:nth-child(5n) {
            transform: skewX(-6deg) rotate(5deg) translateY(3px);
        }

        .p5-space {
            width: 18px;
        }
    </style>
</head>
<body>
