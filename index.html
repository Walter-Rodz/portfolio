<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url('Group 3.svg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-left: 60vw; 
            padding-top: 5vh;
            font-family: 'Montserrat', 'Impact', sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }

        .top-header {
            position: absolute;
            top: 40px;
            left: 4vw;
            z-index: 10;
        }

        .header-title {
            background-color: #fff;
            color: #000;
            padding: 20px 48px;
            font-size: 4.5rem; 
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            border: 7px solid #000;
            box-shadow: 12px 12px 0px #000;
            transform: skewX(-12deg) rotate(-1deg);
            display: inline-block;
            user-select: none;
        }

        .p5-menu {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
        }

        .p5-text-group {
            display: flex;
            align-items: center;
            background-color: #fff;
            color: #000;
            border: 4.5px solid #000;
            padding: 16px 36px;
            cursor: pointer;
            text-transform: uppercase;
            font-style: italic;
            font-size: 2.2rem;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 7px 7px 0px #000;
            transition: all 0.15s ease-in-out;
            user-select: none;
            width: 100%;          
            min-width: 380px;     
            box-sizing: border-box;
        }

        .p5-text-group:hover {
            background-color: #000;
            color: #fff;
            border-color: #fff;
            box-shadow: 6px 6px 0px #d80000;
            transform: skewX(-12deg) scale(1.05);
        }

        .p5-letter {
            display: inline-block;
            font-size: 3.6rem;    
            font-weight: 900;
            font-style: italic;
            color: #111;
            background-color: #fff;
            padding: 4px 14px;    
            margin: -3px;
            border: 3.5px solid #000;
            text-transform: uppercase;
            box-shadow: 5px 5px 0px #000;
            user-select: none;
        }

        .p5-text-group:nth-child(odd) {
            transform: skewX(-12deg) rotate(-1deg);
        }

        .p5-letter:nth-child(3n) {
            transform: skewX(-15deg) rotate(-6deg) scale(1.05);
        }

        .p5-letter:nth-child(5n) {
            transform: skewX(-6deg) rotate(5deg) translateY(3px);
        }

        .p5-space {
            width: 18px;
        }

        @media (max-width: 900px) {
            body {
                padding-left: 0;
                padding-top: 0;
                justify-content: flex-start;
                align-items: center;
                overflow-y: auto;
                padding: 30px 4vw;
            }

            .top-header {
                position: relative;
                top: 0;
                left: 0;
                width: 100%;
                display: flex;
                justify-content: center;
                margin-bottom: 35px;
            }

            .header-title {
                font-size: 1.8rem;
                padding: 10px 20px;
                border: 4px solid #000;
                box-shadow: 6px 6px 0px #000;
                transform: skewX(-12deg) rotate(-1deg);
                text-align: center;
            }

            .p5-menu {
                align-items: center;
                width: 100%;
                max-width: 340px;
            }

            .p5-text-group {
                min-width: unset;
                width: 100%;
                justify-content: center;
                font-size: 1.5rem;
                padding: 12px 20px;
                border: 3.5px solid #000;
                box-shadow: 5px 5px 0px #000;
            }

            .p5-text-group:nth-child(odd) {
                transform: skewX(-12deg) rotate(-1deg);
            }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="header-title">Walter's Portfolio</div>
    </header>

    <div class="p5-menu">
        <a href="about.html" class="p5-text-group">ABOUT ME</a>
        <a href="skills.html" class="p5-text-group">SKILLS</a>
        <a href="project.html" class="p5-text-group">PROJECTS</a>
        <a href="contact.html" class="p5-text-group">CONTACT</a>
    </div>

</body>
</html>
