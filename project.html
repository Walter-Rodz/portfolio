<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('Group 4.svg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            image-rendering: -webkit-optimize-contrast;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 16px 4vw 15px 4vw;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            overflow: hidden;
            box-sizing: border-box;
        }

        .content-shift-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1600px;
            margin-left: 8vw;
            z-index: 2;
        }

        .page-header {
            width: 100%;
            text-align: left;
            margin-bottom: 12px;
        }

        .page-title {
            font-size: 3.2rem;
            text-transform: uppercase;
            font-style: italic;
            color: #fff;
            background: #d80000;
            display: inline-block;
            padding: 5px 26px;
            border: 4px solid #000;
            transform: skewX(-12deg) rotate(-2deg);
            box-shadow: 6px 6px 0px #000;
            margin: 0;
        }

        .main-container {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100%;
            gap: 65px;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 440px; 
            flex-shrink: 0;
        }

        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 18px; 
            width: 100%;
        }

        .project-item {
            display: flex;
            align-items: center;
            background-color: #fff;
            color: #000;
            border: 3px solid #000;
            padding: 9px 18px;
            cursor: pointer;
            text-transform: uppercase;
            font-style: italic;
            font-size: 1.15rem;
            box-shadow: 4px 4px 0px #fff;
            transition: all 0.15s ease-in-out;
            user-select: none;
            transform: skewX(-12deg);
        }

        .project-item:nth-child(even) {
            background-color: #fff;
            color: #000;
            box-shadow: 4px 4px 0px #000;
        }

        .project-item:hover {
            background: #000;
            color: #fff;
            border-color: #fff;
        }

        .project-item.active {
            background: #d80000;
            color: #fff;
            transform: skewX(-12deg) translateY(-3px) scale(1.03);
            box-shadow: 4px 4px 0px #000;
        }

        .video-container {
            width: 100%;
            height: 220px;
            background: #000;
            border: 4px solid #fff;
            box-shadow: 6px 6px 0px #000;
            transform: skewX(-6deg) rotate(-1deg);
            overflow: hidden;
            z-index: 3;
            display: block;
            margin-top: 6px;
        }

        .media-display {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .right-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .details-container {
            position: relative;
            width: 540px;
            height: 410px;
            background: #000;
            border: 4px solid #fff;
            padding: 24px 30px;
            transform: translate(40px, 0px) skewX(-6deg) rotate(1deg); 
            box-shadow: -10px 10px 0px #d80000;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .details-content {
            transform: skewX(6deg); 
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-title {
            font-size: 2.1rem;
            text-transform: uppercase;
            font-style: italic;
            margin: 0;
            color: #fff;
            background: #d80000;
            display: inline-block;
            padding: 4px 14px;
            transform: rotate(-2deg);
            border: 2.5px solid #fff;
            align-self: flex-start;
        }

        .project-description {
            font-size: 1.05rem;
            line-height: 1.4;
            color: #eee;
            margin: 0;
            font-weight: bold;
        }

        .project-tech {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin: 0;
        }

        .tech-tag {
            background: #fff;
            color: #000;
            padding: 4px 10px;
            font-size: 0.9rem;
            font-weight: 900;
            transform: skewX(-10deg);
        }

        .project-links {
            display: flex;
            gap: 10px;
            margin: 0;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-block;
            background: #d80000;
            color: #fff;        
            text-decoration: none;
            font-weight: 900;
            font-style: italic;
            font-size: 1rem;
            padding: 7px 16px;
            border: 2.5px solid #fff;
            transform: skewX(-10deg);
            box-shadow: 3px 3px 0px #000;
            transition: all 0.15s ease-in-out;
            text-transform: uppercase;
        }

        .action-btn:hover {
            background: #fff;    
            color: #000;        
            border-color: #000;
            box-shadow: 3px 3px 0px #d80000;
        }

        .nav-footer {
            position: absolute;
            bottom: 15px;
            left: 4vw;
            z-index: 10;
        }

        .back-link {
            color: #fff;
            background: #000;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            padding: 9px 18px;
            font-size: 1.05rem;
            border: 2.5px solid #fff;
            text-transform: uppercase;
            font-style: italic;
            transition: 0.2s;
            box-shadow: 4px 4px 0px #000;
        }

        .back-link:hover {
            background: #d80000;
            color: #fff;
        }

        @media (max-width: 900px) {
            body {
                height: auto;
                padding: 20px 4vw;
                justify-content: flex-start;
                align-items: center;
                overflow-y: auto;
            }

            .content-shift-wrapper {
                margin-left: 0;
            }

            .page-header {
                text-align: center;
                margin-bottom: 16px;
            }

            .page-title {
                font-size: 2.2rem;
                padding: 6px 16px;
                border: 5px solid #000;
                box-shadow: 8px 8px 0px #000;
                transform: skewX(-12deg) rotate(-2deg);
            }

            .main-container {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .left-column {
                width: 100%;
                max-width: 500px;
                gap: 15px;
            }

            .projects-list {
                flex-direction: row;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 12px;
            }

            .project-item {
                font-size: 1.1rem;
                padding: 7px 14px;
                transform: none !important;
                border: 4px solid #000;
                box-shadow: 6px 6px 0px #fff;
            }

            .project-item.active {
                transform: translateY(-2px) !important;
                box-shadow: 6px 6px 0px #000;
            }

            .right-section {
                width: 100%;
                align-items: center;
            }

            .video-container {
                width: 100%;
                max-width: 500px;
                height: 220px;
                border: 5px solid #fff;
                box-shadow: 8px 8px 0px #000;
                transform: none;
            }

            .details-container {
                width: 100%;
                max-width: 500px;
                height: auto;
                min-height: auto;
                transform: none;
                padding: 20px;
                border: 5px solid #fff;
                box-shadow: -12px 14px 0px #d80000;
            }

            .details-content {
                transform: none;
                gap: 12px;
            }

            .project-title {
                font-size: 1.8rem;
                border: none;
            }

            .project-description {
                font-size: 1rem;
            }

            .tech-tag {
                font-size: 0.95rem;
                padding: 5px 12px;
            }

            .action-btn {
                font-size: 0.95rem;
                padding: 7px 16px;
                border: 3px solid #fff;
                box-shadow: 4px 4px 0px #000;
            }

            .nav-footer {
                position: relative;
                bottom: auto;
                left: auto;
                display: flex;
                justify-content: center;
                margin-top: 25px;
                width: 100%;
            }

            .back-link {
                border: 3px solid #fff;
                font-size: 1.05rem;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="content-shift-wrapper">
        <header class="page-header">
            <h1 class="page-title">Projects</h1>
        </header>

        <div class="main-container">
            <div class="left-column">
                <div class="projects-list">
                    <div class="project-item active" onclick="showProject(0, this)">Blowing off Steam</div>
                    <div class="project-item" onclick="showProject(1, this)">Portfolio site</div>
                    <div class="project-item" onclick="showProject(2, this)">Daylist</div>
                    <div class="project-item" onclick="showProject(3, this)">Solztice</div>
                </div>
                <div class="video-container" id="proj-media-container"></div>
            </div>

            <div class="right-section">
                <div class="details-container">
                    <div class="details-content">
                        <h2 id="proj-title" class="project-title">Solztice</h2>
                        <p id="proj-desc" class="project-description"></p>
                        
                        <div id="proj-tech" class="project-tech"></div>

                        <div id="proj-links" class="project-links"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-footer">
        <a href="index.html" class="back-link">← Back to Main Menu</a>
    </div>

    <script>
        const projects = [
            {
                title: "Blowing off Steam",
                desc: "A web app that uses steam API to record hours spent on steam and input them into leaderboard with the users friends to encourage less playtime whilest gamifying the experience. ",
                tech: ["Next.js", "React", "Tailwind css", "Steam API", "Typescript", "Html/CSS", "Javascript"],
                media: "Recording 2026-09-15 044837.mp4",
                github: "https://github.com/powdermilkjuno/blowingoffsteam",
                demo: "https://blowingoffsteam.vercel.app/dashboard"
            },
            {
                title: "Portfolio site",
                desc: "The site you are currently on. Inspired by video game Persona 5, it is a responsive site that showcases my skills and projects.",
                tech: ["Html", "CSS", "Javascript"],
                github: "https://github.com/Walter-Rodz/portfolio",
            },
            {
                title: "Daylist",
                desc: "A web application that takes a prompt from the user and generates a spotify playlist that best fits the mood of the prompt.",
                tech: ["Gemini API", "React", "Spotify API"],
                media: "Daylist demo.mp4",
                github: "https://github.com/cala28f124-sketch/daylist",
                demo: "https://devpost.com/software/daylist"
            },
            {
                title: "Solztice",
                desc: "A 2.5D top-down action-adventure game that has you exploring another planets trying to find a way to escape fighting enemy and bosses along the way.",
                tech: ["Unity", "C#"],
                media: "ezgif-653b6aace07d6e2e.mp4"
            },
        ];

        function showProject(index, element) {
            document.querySelectorAll('.project-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            const selected = projects[index];
            document.getElementById('proj-title').innerText = selected.title || '';
            document.getElementById('proj-desc').innerText = selected.desc || '';

            const mediaContainer = document.getElementById('proj-media-container');
            mediaContainer.innerHTML = ''; 

            if (selected.media) {
                mediaContainer.style.display = 'block';
                const isGif = selected.media.toLowerCase().endsWith('.gif');
                
                if (isGif) {
                    const img = document.createElement('img');
                    img.src = selected.media;
                    img.alt = selected.title;
                    img.className = 'media-display';
                    mediaContainer.appendChild(img);
                } else {
                    const video = document.createElement('video');
                    video.className = 'media-display';
                    video.autoplay = true;
                    video.loop = true;
                    video.muted = true;
                    video.playsInline = true;

                    const source = document.createElement('source');
                    source.src = selected.media;
                    source.type = 'video/mp4';

                    video.appendChild(source);
                    mediaContainer.appendChild(video);
                    video.play();
                }
            } else {
                mediaContainer.style.display = 'none';
            }

            const techContainer = document.getElementById('proj-tech');
            techContainer.innerHTML = '';
            if (selected.tech) {
                selected.tech.forEach(t => {
                    const tag = document.createElement('span');
                    tag.className = 'tech-tag';
                    tag.innerText = t;
                    techContainer.appendChild(tag);
                });
            }

            const linksContainer = document.getElementById('proj-links');
            linksContainer.innerHTML = '';

            if (selected.github) {
                const ghBtn = document.createElement('a');
                ghBtn.className = 'action-btn';
                ghBtn.href = selected.github;
                ghBtn.target = '_blank';
                ghBtn.innerText = 'GitHub Code ↗';
                linksContainer.appendChild(ghBtn);
            }

            if (selected.demo) {
                const demoBtn = document.createElement('a');
                demoBtn.className = 'action-btn';
                demoBtn.href = selected.demo;
                demoBtn.target = '_blank';
                demoBtn.innerText = 'Live Demo ↗';
                linksContainer.appendChild(demoBtn);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const activeItem = document.querySelector('.project-item.active');
            if (activeItem) {
                showProject(0, activeItem);
            }
        });
    </script>
</body>
</html>
