<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('Assets/ProjectsBack.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4vw;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Left Side: Projects List (Expanded) */
        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 480px;
            z-index: 2;
        }

        .project-item {
            display: flex;
            align-items: center;
            background-color: #fff;
            color: #000;
            border: 4px solid #000;
            padding: 14px 24px;
            cursor: pointer;
            text-transform: uppercase;
            font-style: italic;
            font-size: 1.8rem;
            box-shadow: 6px 6px 0px #fff;
            transition: all 0.15s ease-in-out;
            user-select: none;
        }

        /* Persona 5 skewed cuts */
        .project-item:nth-child(odd) {
            transform: skewX(-12deg) rotate(-1deg);
        }

        .project-item:nth-child(even) {
            transform: skewX(-8deg) rotate(2deg);
            background-color: #fff;
            color: #000;
            box-shadow: 6px 6px 0px #000;
        }

        /* Hover & Active States */
        .project-item:hover{
            background: #000;
            color: #fff;
            border-color: #fff;
        }

        .project-item.active {
            background: #d80000;
            color: #fff;
            transform: skewX(-12deg) translateY(-4px) scale(1.05);
            box-shadow: 6px 6px 0px #000;
        }

        /* Right Section Wrapper */
        .right-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 2;
        }

        /* Video/GIF Container Placed Above */
        .video-container {
            width: 580px;
            height: 300px;
            background: #000;
            border: 5px solid #fff;
            box-shadow: 8px 8px 0px #000;
            transform: translateY(-30px) skewX(-6deg) rotate(-1deg);
            overflow: hidden;
            margin-bottom: -10px; /* Overlaps slightly with the description box */
            z-index: 3;
        }

        .media-display {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Shifted Down & Left Persona 5 Angled Info Box */
        .details-container {
            position: relative;
            width: 650px;
            min-height: 380px;
            background: #000;
            border: 5px solid #fff;
            padding: 45px;
            transform: translate(-80px, 20px) skewX(-6deg) rotate(2deg);
            box-shadow: -12px 14px 0px #d80000;
            z-index: 2;
            box-sizing: border-box;
        }

        .details-content {
            transform: skewX(6deg); /* Counter-skew text so it stays readable */
        }

        .project-title {
            font-size: 2.8rem;
            text-transform: uppercase;
            font-style: italic;
            margin: 0 0 12px 0;
            color: #fff;
            background: #d80000;
            display: inline-block;
            padding: 6px 18px;
            transform: rotate(-2deg);
        }

        .project-category {
            font-size: 1.2rem;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 20px;
            font-style: italic;
        }

        .project-description {
            font-size: 1.35rem;
            line-height: 1.6;
            color: #eee;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .project-tech {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tech-tag {
            background: #fff;
            color: #000;
            padding: 6px 14px;
            font-size: 1.05rem;
            font-weight: 900;
            transform: skewX(-10deg);
        }

        /* Dynamic Links Styling - Red by default, White on Hover */
        .project-links {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-block;
            background: #d80000; /* Red base background */
            color: #fff;        /* White text */
            text-decoration: none;
            font-weight: 900;
            font-style: italic;
            font-size: 1rem;
            padding: 8px 18px;
            border: 3px solid #fff;
            transform: skewX(-10deg);
            box-shadow: 4px 4px 0px #000;
            transition: all 0.15s ease-in-out;
            text-transform: uppercase;
        }

        .action-btn:hover {
            background: #fff;    /* Flips to white background */
            color: #000;        /* Black text */
            border-color: #000;
            box-shadow: 4px 4px 0px #d80000;
        }

        /* Navigation Links */
        .back-link {
            color: #fff;
            background: #000;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            padding: 12px 22px;
            font-size: 1.1rem;
            border: 3px solid #fff;
            text-transform: uppercase;
            font-style: italic;
            transition: 0.2s;
        }

        .back-link:hover {
            background: #d80000;
            color: #fff;
        }

        .nav-footer {
            position: absolute;
            bottom: 30px;
            left: 4vw;
        }
    </style>
</head>
<body>

    <div class="projects-list">
        <div class="project-item active" onclick="showProject(0, this)">Celeste</div>
        <div class="project-item" onclick="showProject(1, this)">Daylist</div>
    </div>

    <div class="right-section">
        
        <div class="video-container" id="proj-media-container">
            </div>

        <div class="details-container">
            <div class="details-content">
                <h2 id="proj-title" class="project-title">Celeste</h2>
                <div id="proj-category" class="project-category">// Mobile Application</div>
                <p id="proj-desc" class="project-description">A high-performance mobile application designed with custom state management and smooth animated UI components inspired by JRPGs.</p>
                
                <div id="proj-tech" class="project-tech">
                    <span class="tech-tag">React Native</span>
                    <span class="tech-tag">TypeScript</span>
                    <span class="tech-tag">Redux</span>
                </div>

                <div id="proj-links" class="project-links"></div>
            </div>
        </div>

    </div>

    <div class="nav-footer">
        <a href="index (1).html" class="back-link">← Back to Main Menu</a>
    </div>

    <script>
        // Project Data Array with URL targets and Media files
        const projects = [
            {
                title: "Celeste",
                category: "// Mobile Application",
                desc: "A high-performance mobile application designed with custom state management and smooth animated UI components inspired by JRPGs.",
                tech: ["React Native", "TypeScript", "Redux"],
                media: "Recording 2026-09-06 002900.gif"
            },
            {
                title: "Daylist",
                category: "// Game Development",
                desc: "A custom 2D WebGL rendering engine built for browser-based games, featuring real-time light rendering and physics calculation.",
                tech: ["WebGL", "JavaScript", "HTML5 Canvas"],
                media: "Daylist demo.mp4",
                github: "https://github.com/cala28124-sketch/daylist",
                demo: "https://devpost.com/software/daylist"
            },
        ];

        // Function to update content, media (GIF/Video), tags, and action buttons
        function showProject(index, element) {
            // Update Active class styling
            document.querySelectorAll('.project-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            // Update Panel Text
            const selected = projects[index];
            document.getElementById('proj-title').innerText = selected.title;
            document.getElementById('proj-category').innerText = selected.category;
            document.getElementById('proj-desc').innerText = selected.desc;

            // Render Video or Image GIF dynamically depending on extension
            const mediaContainer = document.getElementById('proj-media-container');
            mediaContainer.innerHTML = ''; // Clear existing media

            if (selected.media) {
                const isGif = selected.media.toLowerCase().endsWith('.gif');
                
                if (isGif) {
                    const img = document.createElement('img');
                    img.src = selected.media;
                    img.alt = selected.title;
                    img.className = 'media-display';
                    mediaContainer.appendChild(img);
                } else {
                    const video = document.createElement('video');
                    video.className = 'media-display';
                    video.autoplay = true;
                    video.loop = true;
                    video.muted = true;
                    video.playsInline = true;

                    const source = document.createElement('source');
                    source.src = selected.media;
                    source.type = 'video/mp4';

                    video.appendChild(source);
                    mediaContainer.appendChild(video);
                    video.play();
                }
            }

            // Update Tech Tags
            const techContainer = document.getElementById('proj-tech');
            techContainer.innerHTML = '';
            selected.tech.forEach(t => {
                const tag = document.createElement('span');
                tag.className = 'tech-tag';
                tag.innerText = t;
                techContainer.appendChild(tag);
            });

            // Dynamically Render GitHub and Demo Links
            const linksContainer = document.getElementById('proj-links');
            linksContainer.innerHTML = '';

            if (selected.github) {
                const ghBtn = document.createElement('a');
                ghBtn.className = 'action-btn';
                ghBtn.href = selected.github;
                ghBtn.target = '_blank';
                ghBtn.innerText = 'GitHub Code ↗';
                linksContainer.appendChild(ghBtn);
            }

            if (selected.demo) {
                const demoBtn = document.createElement('a');
                demoBtn.className = 'action-btn';
                demoBtn.href = selected.demo;
                demoBtn.target = '_blank';
                demoBtn.innerText = 'Live Demo ↗';
                linksContainer.appendChild(demoBtn);
            }
        }

        // Run on initial load to ensure active project links and GIF render immediately
        document.addEventListener('DOMContentLoaded', () => {
            const activeItem = document.querySelector('.project-item.active');
            if (activeItem) {
                showProject(0, activeItem);
            }
        });
    </script>

</body>
</html>
