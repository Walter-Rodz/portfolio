<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('Group 4.svg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            image-rendering: -webkit-optimize-contrast;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 16px 4vw 15px 4vw;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            box-sizing: border-box;
        }

        .content-shift-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1700px;
            margin-left: 4vw;
            z-index: 2;
        }

        .page-header {
            width: 100%;
            text-align: left;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 3.2rem;
            text-transform: uppercase;
            font-style: italic;
            color: #fff;
            background: #d80000;
            display: inline-block;
            padding: 5px 26px;
            border: 4px solid #000;
            transform: skewX(-12deg) rotate(-2deg);
            box-shadow: 6px 6px 0px #000;
            margin: 0;
        }

        .main-container {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100%;
            gap: 50px;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 440px; 
            flex-shrink: 0;
        }

        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 16px; 
            width: 100%;
        }

        .project-item {
            display: flex;
            align-items: center;
            background-color: #fff;
            color: #000;
            border: 3px solid #000;
            padding: 11px 18px;
            cursor: pointer;
            text-transform: uppercase;
            font-style: italic;
            font-size: 1.15rem;
            box-shadow: 4px 4px 0px #fff;
            transition: all 0.15s ease-in-out;
            user-select: none;
            transform: skewX(-12deg);
        }

        .project-item:nth-child(even) {
            background-color: #fff;
            color: #000;
            box-shadow: 4px 4px 0px #000;
        }

        .project-item:hover {
            background: #000;
            color: #fff;
            border-color: #fff;
        }

        .project-item.active {
            background: #d80000;
            color: #fff;
            transform: skewX(-12deg) translateY(-3px) scale(1.03);
            box-shadow: 4px 4px 0px #000;
        }

        .video-container {
            width: 500px;
            height: 310px;
            background: #000;
            border: 4px solid #fff;
            box-shadow: 6px 6px 0px #000;
            transform: skewX(-6deg) rotate(-1deg);
            overflow: hidden;
            z-index: 3;
            display: block;
        }

        .media-display {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .right-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex-grow: 1;
        }

        .details-container {
            position: relative;
            width: 100%;
            max-width: 680px;
            min-height: 480px;
            background: #000;
            border: 4px solid #fff;
            padding: 36px 42px;
            transform: translate(300px, 0px) skewX(-6deg) rotate(1deg); 
            box-shadow: -10px 10px 0px #d80000;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .details-content {
            transform: skewX(6deg); 
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 20px;
        }

        .project-title {
            font-size: 2.4rem;
            text-transform: uppercase;
            font-style: italic;
            margin: 0;
            color: #fff;
            background: #d80000;
            display: inline-block;
            padding: 6px 18px;
            transform: rotate(-2deg);
            border: 2.5px solid #fff;
            align-self: flex-start;
        }

        .project-description {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #eee;
            margin: 0;
            font-weight: bold;
        }

        .project-tech {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0;
        }

        .tech-tag {
            background: #fff;
            color: #000;
            padding: 5px 12px;
            font-size: 0.95rem;
            font-weight: 900;
            transform: skewX(-10deg);
        }

        .project-links {
            display: flex;
            gap: 12px;
            margin: 0;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-block;
            background: #d80000;
            color: #fff;        
            text-decoration: none;
            font-weight: 900;
            font-style: italic;
            font-size: 1.05rem;
            padding: 9px 20px;
            border: 2.5px solid #fff;
            transform: skewX(-10deg);
            box-shadow: 3px 3px 0px #000;
            transition: all 0.15s ease-in-out;
            text-transform: uppercase;
        }

        .action-btn:hover {
            background: #fff;    
            color: #000;        
            border-color: #000;
            box-shadow: 3px 3px 0px #d80000;
        }

        .nav-footer {
            margin-top: 30px;
            z-index: 10;
        }

        .back-link {
            color: #fff;
            background: #000;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            padding: 9px 18px;
            font-size: 1.05rem;
            border: 2.5px solid #fff;
            text-transform: uppercase;
            font-style: italic;
            transition: 0.2s;
            box-shadow: 4px 4px 0px #000;
        }

        .back-link:hover {
            background: #d80000;
            color: #fff;
        }

        @media (max-width: 1024px) {
            body {
                height: auto;
                overflow-y: auto;
            }

            .content-shift-wrapper {
                margin-left: 0;
            }

            .main-container {
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }

            .left-column {
                width: 100%;
                max-width: 600px;
            }

            .video-container {
                height: 280px;
                transform: none;
            }

            .right-section {
                width: 100%;
                align-items: center;
            }

            .details-container {
                width: 100%;
                max-width: 600px;
                min-height: auto;
                transform: none;
            }

            .details-content {
                transform: none;
            }
        }
    </style>
</head>
<body>

    <div class="content-shift-wrapper">
        <header class="page-header">
            <h1 class="page-title">Projects</h1>
        </header>

        <div class="main-container">
            <div class="left-column">
                <div class="projects-list">
                    <div class="project-item active" onclick="showProject(0, this)">Go Retro With Us</div>
                    <div class="project-item active" onclick="showProject(1, this)">Blowing off Steam</div>
                    <div class="project-item" onclick="showProject(2, this)">Portfolio site</div>
                    <div class="project-item" onclick="showProject(3, this)">Daylist</div>
                    <div class="project-item" onclick="showProject(4, this)">Solztice</div>
                </div>
                <div class="video-container" id="proj-media-container"></div>
            </div>

            <div class="right-section">
                <div class="details-container">
                    <div class="details-content">
                        <h2 id="proj-title" class="project-title">Solztice</h2>
                        <p id="proj-desc" class="project-description"></p>
                        
                        <div id="proj-tech" class="project-tech"></div>

                        <div id="proj-links" class="project-links"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="nav-footer">
            <a href="index.html" class="back-link">← Back to Main Menu</a>
        </div>
    </div>

    <script>
        const projects = [
            {
                title: "Go Retro With Us",
                desc: "A web app designed to let users view different emulation consoles and allows them to create a collection either by viewing the specs of each console and adding them or using AI to find consoles to add",
                tech: ["Next.js", "React", "Tailwind css", "Gemini API", "Typescript", "Html/CSS", "Javascript"],
                media: "Recording 2026-10-02 023148.mp4",
                github: "https://github.com/christians-create/GoRetroWithUs",
                demo: "https://devpost.com/software/goretrowithus"
            },
            {
                title: "Blowing off Steam",
                desc: "A web app that uses steam API to record hours spent on steam and input them into leaderboard with the users friends to encourage less playtime whilest gamifying the experience. ",
                tech: ["Next.js", "React", "Tailwind css", "Steam API", "Typescript", "Html/CSS", "Javascript"],
                media: "Recording 2026-09-15 044837.mp4",
                github: "https://github.com/powdermilkjuno/blowingoffsteam",
                demo: "https://blowingoffsteam.vercel.app/dashboard"
            },
            {
                title: "Portfolio site",
                desc: "The site you are currently on. Inspired by video game Persona 5, it is a responsive site that showcases my skills and projects.",
                tech: ["Html", "CSS", "Javascript"],
                github: "https://github.com/Walter-Rodz/portfolio",
            },
            {
                title: "Daylist",
                desc: "A web application that takes a prompt from the user and generates a spotify playlist that best fits the mood of the prompt.",
                tech: ["Gemini API", "React", "Spotify API"],
                media: "Daylist demo.mp4",
                github: "https://github.com/cala28f124-sketch/daylist",
                demo: "https://devpost.com/software/daylist"
            },
            {
                title: "Solztice",
                desc: "A 2.5D top-down action-adventure game that has you exploring another planets trying to find a way to escape fighting enemy and bosses along the way.",
                tech: ["Unity", "C#"],
                media: "ezgif-653b6aace07d6e2e.mp4"
            },
        ];

        function showProject(index, element) {
            document.querySelectorAll('.project-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            const selected = projects[index];
            document.getElementById('proj-title').innerText = selected.title || '';
            document.getElementById('proj-desc').innerText = selected.desc || '';

            const mediaContainer = document.getElementById('proj-media-container');
            mediaContainer.innerHTML = ''; 

            if (selected.media) {
                mediaContainer.style.display = 'block';
                const isGif = selected.media.toLowerCase().endsWith('.gif');
                
                if (isGif) {
                    const img = document.createElement('img');
                    img.src = selected.media;
                    img.alt = selected.title;
                    img.className = 'media-display';
                    mediaContainer.appendChild(img);
                } else {
                    const video = document.createElement('video');
                    video.className = 'media-display';
                    video.autoplay = true;
                    video.loop = true;
                    video.muted = true;
                    video.playsInline = true;

                    const source = document.createElement('source');
                    source.src = selected.media;
                    source.type = 'video/mp4';

                    video.appendChild(source);
                    mediaContainer.appendChild(video);
                    video.play();
                }
            } else {
                mediaContainer.style.display = 'none';
            }

            const techContainer = document.getElementById('proj-tech');
            techContainer.innerHTML = '';
            if (selected.tech) {
                selected.tech.forEach(t => {
                    const tag = document.createElement('span');
                    tag.className = 'tech-tag';
                    tag.innerText = t;
                    techContainer.appendChild(tag);
                });
            }

            const linksContainer = document.getElementById('proj-links');
            linksContainer.innerHTML = '';

            if (selected.github) {
                const ghBtn = document.createElement('a');
                ghBtn.className = 'action-btn';
                ghBtn.href = selected.github;
                ghBtn.target = '_blank';
                ghBtn.innerText = 'GitHub Code ↗';
                linksContainer.appendChild(ghBtn);
            }

            if (selected.demo) {
                const demoBtn = document.createElement('a');
                demoBtn.className = 'action-btn';
                demoBtn.href = selected.demo;
                demoBtn.target = '_blank';
                demoBtn.innerText = 'Live Demo ↗';
                linksContainer.appendChild(demoBtn);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const activeItem = document.querySelector('.project-item.active');
            if (activeItem) {
                showProject(0, activeItem);
            }
        });
    </script>
</body>
</html>
