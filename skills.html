<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('691bd9e6b26e60ccf41d27652922d250 (1).jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 4vw;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .page-header {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
            z-index: 3;
        }

        .page-title {
            font-size: 3.5rem;
            text-transform: uppercase;
            font-style: italic;
            color: #fff;
            background: #d80000;
            display: inline-block;
            padding: 8px 30px;
            border: 5px solid #000;
            transform: skewX(-12deg) rotate(-2deg);
            box-shadow: 8px 8px 0px #000;
            margin: 0;
        }

        .skills-wrapper {
            position: relative;
            width: 100%;
            max-width: 680px;
            margin-top: 40px;
            z-index: 2;
        }

        .tabs-header {
            display: flex;
            gap: 15px;
            position: absolute;
            top: -38px;
            left: 20px;
            z-index: 3;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #fff;
            color: #000;
            border: 3px solid #000;
            padding: 8px 20px;
            font-size: 1.2rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            cursor: pointer;
            transform: skewX(-12deg);
            box-shadow: 4px 4px 0px #000;
            transition: all 0.15s ease-in-out;
            user-select: none;
        }

        .tab-btn.active {
            background: #d80000;
            color: #fff;
            transform: skewX(-12deg) translateY(-4px) scale(1.05);
            box-shadow: 6px 6px 0px #000;
        }

        .tab-btn:hover:not(.active) {
            background: #000;
            color: #fff;
            border-color: #fff;
        }

        .content-box {
            position: relative;
            background: #000;
            border: 5px solid #fff;
            padding: 40px 45px;
            transform: skewX(-6deg) rotate(1deg);
            box-shadow: -12px 14px 0px #d80000;
            z-index: 2;
            box-sizing: border-box;
            min-height: 380px;
        }

        .box-inner {
            transform: skewX(6deg);
        }

        .category-title {
            font-size: 2.5rem;
            text-transform: uppercase;
            font-style: italic;
            margin: 0 0 25px 0;
            color: #fff;
            background: #d80000;
            display: inline-block;
            padding: 4px 16px;
            transform: rotate(-2deg);
        }

        .skill-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .skill-row {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-left: 5px solid #d80000;
            padding: 10px 18px;
            transform: skewX(-4deg);
        }

        .skill-name {
            font-size: 1.4rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
        }

        .nav-footer {
            margin-top: 45px;
            z-index: 3;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .back-link {
            color: #fff;
            background: #000;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            padding: 12px 24px;
            font-size: 1.1rem;
            border: 3px solid #fff;
            text-transform: uppercase;
            font-style: italic;
            box-shadow: 4px 4px 0px #d80000;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background: #d80000;
            color: #fff;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 4vw;
                justify-content: flex-start;
                overflow-y: auto;
            }

            .page-title {
                font-size: 2.2rem;
                padding: 6px 16px;
            }

            .skills-wrapper {
                margin-top: 15px;
            }

            .tabs-header {
                position: relative;
                top: 0;
                left: 0;
                justify-content: center;
                margin-bottom: 15px;
                gap: 10px;
            }

            .tab-btn {
                font-size: 1rem;
                padding: 8px 14px;
                transform: none !important;
                box-shadow: 3px 3px 0px #000;
            }

            .tab-btn.active {
                transform: translateY(-2px) !important;
            }

            .content-box {
                transform: none;
                padding: 25px 20px;
                min-height: auto;
                box-shadow: 6px 6px 0px #d80000;
            }

            .box-inner {
                transform: none;
            }

            .category-title {
                font-size: 1.8rem;
            }

            .skill-row {
                transform: none;
            }

            .skill-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <header class="page-header">
        <h1 class="page-title">Skills</h1>
    </header>

    <div class="skills-wrapper">
        
        <div class="tabs-header">
            <button class="tab-btn active" onclick="switchTab(0, this)">Frontend</button>
            <button class="tab-btn" onclick="switchTab(1, this)">Backend</button>
            <button class="tab-btn" onclick="switchTab(2, this)">Tools </button>
        </div>

        <div class="content-box">
            <div class="box-inner">
                <h1 id="cat-title" class="category-title">FRONTEND</h1>

                <div id="skills-container" class="skill-list">
                </div>
            </div>
        </div>

    </div>

    <div class="nav-footer">
        <a href="index (1).html" class="back-link">← Back to Main Menu</a>
    </div>

    <script>
        const skillCategories = [
            {
                title: "Frontend",
                skills: [
                    { name: "HTML / CSS" },
                    { name: "JavaScript" },
                    { name: "React" },
                ]
            },
            {
                title: "Backend",
                skills: [
                    { name: "C#" },
                    { name: "Python" },
                    { name: "C/C++" },
                    { name: "Java" }
                ]
            },
            {
                title: "Tools",
                skills: [
                    { name: "GitHub" },
                    { name: "VS Code" },
                    { name: "Unity" },
                    { name: "Gemini API" }
                ]
            }
        ];

        function renderSkills(categoryIndex) {
            const category = skillCategories[categoryIndex];
            document.getElementById('cat-title').innerText = category.title;

            const container = document.getElementById('skills-container');
            container.innerHTML = '';

            category.skills.forEach(skill => {
                const row = document.createElement('div');
                row.className = 'skill-row';
                row.innerHTML = `<span class="skill-name">${skill.name}</span>`;
                container.appendChild(row);
            });
        }

        function switchTab(index, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderSkills(index);
        }

        renderSkills(0);
    </script>

</body>
</html>
